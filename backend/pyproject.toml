[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertrace-backend"
version = "0.1.0"
description = "CyberTrace defensive investigation platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "httpx>=0.27,<1.0",
    "pandas>=2.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pymysql>=1.1,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "reportlab>=4.2,<5.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
